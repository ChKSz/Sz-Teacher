# 宝塔：网站 → 你的站点 → 设置 → 配置文件，把下面的 location 段加到 server { } 里
# （或者用宝塔"反向代理"功能，目标 URL 填 http://127.0.0.1:3000，然后补上流式输出相关的几行）。
# 站点根目录使用独立空目录 /www/wwwroot/sz-teacher-public，禁止指向项目源码或 data。
# 保留宝塔的证书验证配置；删除默认静态资源缓存 location，避免它们截走 JS、CSS、图片请求。
# 已有 location / 时替换该段，不要重复添加；不需要 PHP 配置。

    # 上传题目照片需要较大的请求体
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # 用 $http_host 保留端口号，否则在非 443 端口访问时登录会被当成跨站请求拒绝
        proxy_set_header Host $http_host;
        # 覆盖客户端传来的代理域名，保证跨站校验使用真实访问域名
        proxy_set_header X-Forwarded-Host $http_host;
        # 必须有：程序用它识别真实 IP 来限制密码重试次数
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出（解答边生成边显示）必须关闭缓冲，否则会等全部生成完才一次性显示
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
